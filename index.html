<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorpedia PRO | Base de Datos de Averías OBD2 y Soluciones OEM</title>
    <meta name="description" content="Diagnóstico técnico de códigos de avería DTC OBD2, síntomas, comprobaciones de taller, vídeos paso a paso y repuestos OEM.">
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --border: #282828;
            --cyan: #00ACC1;
            --blue: #1E88E5;
            --green: #00E676;
            --red: #E53935;
            --amber: #FFB300;
            --text: #FFFFFF;
            --muted: #9E9E9E;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 780px; margin: 0 auto; line-height: 1.5; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 16px; }
        .brand { font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; color: var(--text); }
        .brand span { color: var(--cyan); }
        .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 10px; font-weight: 700; text-transform: uppercase; }
        button { background: var(--blue); color: #fff; border: none; padding: 12px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; background: rgba(229,57,53,0.2); color: var(--red); border: 1px solid var(--red); }
        .dtc-title { font-size: 2rem; font-weight: 900; color: var(--text); margin: 6px 0; }
        .dtc-sub { color: var(--cyan); font-weight: 700; font-size: 1rem; margin-bottom: 10px; }
        h3 { font-size: 0.85rem; letter-spacing: 1px; color: var(--amber); margin-bottom: 10px; text-transform: uppercase; }
        ul { padding-left: 18px; color: #E0E0E0; font-size: 0.95rem; }
        li { margin-bottom: 6px; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
        .btn-link { display: block; text-align: center; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 0.9rem; }
        .btn-yt { background: #261010; color: #fff; border: 1px solid var(--red); }
        .btn-amz { background: #261E0A; color: #fff; border: 1px solid var(--amber); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">MOTORPEDIA <span>PRO</span></div>
        <div id="marcaTag" style="font-size: 0.8rem; font-weight: 800; color: var(--cyan);">DIVISIÓN OEM</div>
    </div>

    <div class="search-box">
        <input type="text" id="inputCodigo" placeholder="Buscar código DTC (ej: P0171, P0420, P0301)...">
        <button onclick="buscarManual()">ANALIZAR</button>
    </div>

    <div class="card">
        <span class="badge" id="gravedadDtc">DIAGNÓSTICO VERIFICADO</span>
        <div class="dtc-title" id="codigoDtc">P0171</div>
        <div class="dtc-sub" id="descDtc">Sistema demasiado pobre (Banco 1)</div>
        <p style="color: var(--green); font-family: monospace; font-weight: 700; font-size: 0.9rem;" id="piezaOem"></p>
        <div class="actions">
            <a id="linkYoutube" href="#" target="_blank" class="btn-link btn-yt">▶ VER VÍDEO EN YOUTUBE</a>
            <a id="linkAmazon" href="#" target="_blank" class="btn-link btn-amz">🛒 BUSCAR REPUESTO OEM</a>
        </div>
    </div>

    <div class="card">
        <h3>🔧 Causas Probables en Taller</h3>
        <ul id="listaCausas"></ul>
    </div>

    <div class="card">
        <h3>⚡ Protocolo de Comprobación Motorpedia PRO</h3>
        <p id="textoPrueba" style="color: #E0E0E0; font-size: 0.95rem;"></p>
    </div>

    <script>
        const baseDatosDtc = {
            "P0171": {
                desc: "Sistema demasiado pobre en Banco 1 (Mezcla con exceso de aire o falta de combustible)",
                pieza: "Sensor Caudalímetro (MAF) / Sonda Lambda B1S1 / Tubos de Vacío",
                causas: [
                    "Toma de aire no medida después del sensor MAF (manguito rajado o junta de colector).",
                    "Filamento del sensor MAF sucio de polvo o aceite.",
                    "Presión insuficiente en la rampa de inyección o filtro de combustible obstruido.",
                    "Sonda Lambda Pre-Catalizador fatigada."
                ],
                prueba: "Revisa los ajustes de inyección STFT y LTFT en el módulo de Emisiones de Motorpedia PRO. Si al acelerar a 2.500 RPM el valor LTFT mejora y se acerca a 0%, existe una entrada de aire parásita en el colector de admisión."
            },
            "P0420": {
                desc: "Eficiencia del sistema catalítico por debajo del umbral (Banco 1)",
                pieza: "Catalizador de Tres Vías (TWC) / Sonda Lambda Post-Catalizador (B1S2)",
                causas: [
                    "Monolito cerámico del catalizador agotado o saturado.",
                    "Fuga en el tramo de escape antes de la segunda sonda lambda.",
                    "Sonda Lambda 2 (Post-Catalizador) defectuosa oscilando al mismo ritmo que la Sonda 1."
                ],
                prueba: "Abre Telemetría en Vivo PRO en modo Osciloscopio para las Sondas Lambda 1 y 2 con el motor a 90°C. La Sonda 1 debe oscilar entre 0.1V y 0.8V, y la Sonda 2 debe mantenerse estable cerca de 0.65V."
            },
            "U0100": {
                desc: "Pérdida de comunicación con el Módulo de Control del Motor (ECM/PCM)",
                pieza: "Red CAN Bus (Líneas CAN-H / CAN-L) / Alimentación y Masas ECU",
                causas: [
                    "Caída de tensión de la batería de 12V durante el arranque.",
                    "Conector de centralita o masa de chasis con sulfatación.",
                    "Fusible principal de alimentación IG1/ECM abierto."
                ],
                prueba: "Verifica el voltaje de batería en la Consola OBD2 con el comando AT RV y comprueba la continuidad de las líneas CAN en los pines 6 y 14 del conector de diagnóstico."
            }
        };

        function renderizar(codigoRaw, marcaRaw) {
            const codigo = (codigoRaw || "P0171").toUpperCase().trim();
            const marca = (marcaRaw || "OEM").trim();
            document.getElementById("inputCodigo").value = codigo;
            document.getElementById("marcaTag").innerText = "DIVISIÓN: " + marca.toUpperCase();
            document.getElementById("codigoDtc").innerText = codigo;

            const info = baseDatosDtc[codigo] || {
                desc: "Código de diagnóstico registrado en centralita (" + codigo + ")",
                pieza: "Sensor / Actuador del circuito " + codigo,
                causas: [
                    "Señal fuera de umbral en el sensor o actuador asociado al código " + codigo + ".",
                    "Conector eléctrico sulfatado, cableado rozado o caída de masa.",
                    "Atasco mecánico por carbonilla o desgaste térmico."
                ],
                prueba: "Consulta los datos congelados (Freeze Frame) en Motorpedia PRO y verifica la lectura en tiempo real del sensor desde el Listado de Sensores ECU antes de sustituir el componente."
            };

            document.title = codigo + " (" + marca + ") - Solución y Diagnóstico | Motorpedia PRO";
            document.getElementById("descDtc").innerText = info.desc;
            document.getElementById("piezaOem").innerText = "PIEZA AFECTADA (" + marca.toUpperCase() + "): " + info.pieza;
            document.getElementById("textoPrueba").innerText = info.prueba;

            const ul = document.getElementById("listaCausas");
            ul.innerHTML = "";
            info.causas.forEach(c => {
                const li = document.createElement("li");
                li.innerText = c;
                ul.appendChild(li);
            });

            document.getElementById("linkYoutube").href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(codigo + " " + marca + " reparacion OBD2");
            document.getElementById("linkAmazon").href = "https://www.amazon.es/s?k=" + encodeURIComponent(info.pieza + " " + marca + " " + codigo);
        }

        function buscarManual() {
            const val = document.getElementById("inputCodigo").value;
            const params = new URLSearchParams(window.location.search);
            renderizar(val, params.get("marca") || "OEM");
        }

        const params = new URLSearchParams(window.location.search);
        renderizar(params.get("codigo") || "P0171", params.get("marca") || "Honda");
    </script>
</body>
</html>
