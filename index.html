<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtimaDev | Estudio de Desarrollo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container { max-width: 800px; padding: 2rem; }
        h1 { color: #ffffff; font-size: 3.5rem; margin-bottom: 0.2rem; letter-spacing: -1px; }
        p.subtitle { font-size: 1.2rem; color: #8b949e; margin-bottom: 3rem; }
        
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-5px); }
        
        .card h2 { color: #e50914; margin-top: 0; font-size: 2rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .card p { font-size: 1.1rem; line-height: 1.5; color: #c9d1d9; margin-bottom: 2rem; }
        
        .btn {
            display: inline-block;
            background-color: #c9d1d9;
            color: #0d1117;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }
        .btn:hover { background-color: #ffffff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ArtimaDev</h1>
        <p class="subtitle">Creando software independiente con propósito.</p>
        
        <div class="card">
            <h2>🎟️ CineMatch</h2>
            <p>Tu recomendador inteligente de películas y series. Descubre qué ver esta noche sin pasarte horas navegando por catálogos.</p>
            <a href="#" class="btn">Próximamente en Google Play</a>
        </div>
    </div>
</body>
</html>
